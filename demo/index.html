<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Coin Coding</title>
<style>
  :root { --gold:#e6b84c; --ink:#2b2b28; --mute:#9b9b94; --line:#e8e7e2; --bg:#fafaf7; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; overflow:hidden; background:var(--bg);
         font-family:-apple-system,"PingFang SC",sans-serif; color:var(--ink); }

  #topbar { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
            align-items:baseline; padding:22px 28px; z-index:10; }
  #status { font-size:13px; color:var(--mute); }
  #status::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%;
                    background:#d4d4cd; margin-right:8px; vertical-align:2px; transition:background .3s; }
  #status.working::before { background:#34a36b; }
  #status.paused::before { background:#d9a13b; }
  #hud { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  #hud::before { content:""; display:inline-block; width:12px; height:12px; border-radius:50%;
                 background:var(--gold); margin-right:10px; }

  .coin { position:absolute; border-radius:50%; cursor:pointer; user-select:none; z-index:5;
          background:var(--gold); display:flex; align-items:center; justify-content:center;
          font-weight:600; color:rgba(255,255,255,.95); }
  .coin.big { background:var(--ink); }
  .coin:active { opacity:.5; }

  .pop { position:absolute; font-size:14px; color:var(--mute); pointer-events:none; z-index:8;
         animation:rise .6s ease-out forwards; }
  @keyframes rise { to { transform:translateY(-30px); opacity:0; } }

  #bottombar { position:fixed; bottom:22px; right:28px; display:flex; gap:24px; z-index:10; }
  .lk { background:none; border:none; padding:0; font-size:13px; color:var(--mute);
        cursor:pointer; border-bottom:1px solid transparent; }
  .lk:hover { color:var(--ink); border-bottom-color:var(--ink); }

  #rankOverlay { position:fixed; inset:0; background:rgba(250,250,247,.88); display:none;
                 align-items:center; justify-content:center; z-index:20; }
  #rankOverlay.show { display:flex; }
  #rankCard { width:360px; max-height:76vh; overflow:auto; background:#fff;
              border:1px solid var(--line); border-radius:6px; padding:28px 28px 20px; }
  #rankCard h2 { margin:0 0 2px; font-size:15px; font-weight:600; }
  #rankCard .sub { color:var(--mute); font-size:12px; margin-bottom:20px; }
  .row { display:flex; align-items:baseline; gap:14px; padding:8px 0;
         border-bottom:1px solid var(--line); font-size:14px; }
  .row:last-of-type { border-bottom:none; }
  .rk { width:22px; color:var(--mute); font-variant-numeric:tabular-nums; font-size:13px; }
  .uname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .score { font-variant-numeric:tabular-nums; font-weight:600; }
  .row.me { border-top:1px solid var(--ink); border-bottom:none; margin-top:6px; padding-top:14px; }
  .close { margin-top:20px; width:100%; background:none; border:none; padding:8px 0;
           font-size:13px; color:var(--mute); cursor:pointer; }
  .close:hover { color:var(--ink); }
</style>
</head>
<body>
<div id="topbar">
  <span id="status">等待 Claude 开工</span>
  <span id="hud">0</span>
</div>
<div id="bottombar">
  <button class="lk" id="rankBtn">排行榜</button>
  <button class="lk" id="testBtn">测试模式</button>
</div>

<div id="rankOverlay">
  <div id="rankCard">
    <h2>排行榜</h2>
    <div class="sub">示意数据 · 正式版显示 GitHub 用户名</div>
    <div id="rankList"></div>
    <button class="close" id="rankClose">关闭</button>
  </div>
</div>

<script>
const FALL_SECONDS = 4, SPAWN_MS = 2000, BIG_CHANCE = 0.05;
let coins = parseInt(localStorage.getItem('coins') || '0');
let working = false, testMode = false, spawnTimer = null;
const hud = document.getElementById('hud'), statusEl = document.getElementById('status');
const btn = document.getElementById('testBtn');
hud.textContent = coins;

/* 很轻的一声短促提示音 */
let actx = null;
function tickSound() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = 1180;
    g.gain.setValueAtTime(0.05, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + 0.15);
  } catch (e) {}
}

function spawn() {
  const big = Math.random() < BIG_CHANCE;
  const size = big ? 54 : 40, value = big ? 10 : 1;
  const el = document.createElement('div');
  el.className = 'coin' + (big ? ' big' : '');
  el.style.width = el.style.height = size + 'px';
  el.style.fontSize = '13px';
  el.textContent = value;
  el.style.left = Math.random() * (innerWidth - size) + 'px';
  el.style.top = -size + 'px';
  document.body.appendChild(el);
  const start = performance.now();
  function fall(now) {
    const t = (now - start) / (FALL_SECONDS * 1000);
    if (t >= 1) { el.remove(); return; }
    el.style.top = (-56 + t * (innerHeight + 112)) + 'px';
    if (el.isConnected) requestAnimationFrame(fall);
  }
  requestAnimationFrame(fall);
  el.onmousedown = e => {
    coins += value;
    localStorage.setItem('coins', coins);
    hud.textContent = coins;
    tickSound();
    const pop = document.createElement('div');
    pop.className = 'pop'; pop.textContent = '+' + value;
    pop.style.left = e.clientX + 6 + 'px'; pop.style.top = (e.clientY - 24) + 'px';
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 600);
    el.remove();
  };
}

function setWorking(on, label, cls) {
  statusEl.textContent = label; statusEl.className = cls || '';
  if (on === working) return;
  working = on;
  if (on) { spawn(); spawnTimer = setInterval(spawn, SPAWN_MS); }
  else { clearInterval(spawnTimer); }
}

btn.onclick = () => {
  testMode = !testMode;
  btn.textContent = testMode ? '停止测试' : '测试模式';
  if (testMode) setWorking(true, '测试模式', 'working');
  else setWorking(false, '等待 Claude 开工');
};

async function poll() {
  if (testMode) return;
  try {
    const r = await fetch('/state.txt?' + Date.now());
    const s = (await r.text()).trim();
    if (s === 'working') setWorking(true, 'Claude 工作中', 'working');
    else if (s === 'paused') setWorking(false, '等待你批准', 'paused');
    else setWorking(false, 'Claude 空闲');
  } catch (e) {}
}
setInterval(poll, 500);

const mock = [
  ['torvalds-fan', 284350], ['vibe_coder_42', 261200], ['shipfast-dev', 248900],
  ['0xKaiju', 197540], ['rustacean_m', 165320], ['asyncawaiter', 142800],
  ['gpu_poor', 118650], ['midnight-merge', 97420], ['ship-it-sam', 76310], ['hookmaster', 58200],
];
const overlay = document.getElementById('rankOverlay');
const list = document.getElementById('rankList');

function renderRank() {
  let html = '';
  mock.forEach(([name, score], i) => {
    html += `<div class="row">
      <span class="rk">${i + 1}</span>
      <span class="uname">${name}</span>
      <span class="score">${score.toLocaleString()}</span>
    </div>`;
  });
  html += `<div class="row me">
    <span class="rk">—</span>
    <span class="uname">你</span>
    <span class="score">${coins.toLocaleString()}</span>
  </div>`;
  list.innerHTML = html;
}

document.getElementById('rankBtn').onclick = () => { renderRank(); overlay.classList.add('show'); };
document.getElementById('rankClose').onclick = () => overlay.classList.remove('show');
overlay.onclick = e => { if (e.target === overlay) overlay.classList.remove('show'); };
</script>
</body>
</html>
