<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Coin Coding</title>
<style>
  :root { --bg:#0d1117; --line:#21262d; --text:#8b949e; --bright:#e6edf3;
          --green:#3fb950; --amber:#d29922; --dim:#484f58; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; overflow:hidden; background:var(--bg);
         font-family:"SF Mono",Menlo,Consolas,monospace; color:var(--text); font-size:13px; }

  #topbar { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
            padding:18px 24px; z-index:10; }
  #status .p { color:var(--dim); }
  #status .cur { display:inline-block; width:7px; height:13px; background:var(--text);
                 vertical-align:-2px; margin-left:2px; animation:blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #status.working .v { color:var(--green); }
  #status.paused .v { color:var(--amber); }
  #hud { color:var(--bright); }
  #hud b { color:var(--amber); font-weight:600; }

  .coin { position:absolute; z-index:5; cursor:pointer; user-select:none;
          display:flex; align-items:center; justify-content:center;
          border:2px solid currentColor; border-radius:50%;
          color:var(--amber); font-weight:600; }
  .coin.big { color:var(--green); }
  .coin:active { opacity:.4; }

  .pop { position:absolute; pointer-events:none; z-index:8; color:var(--dim);
         animation:rise .6s ease-out forwards; }
  @keyframes rise { to { transform:translateY(-26px); opacity:0; } }

  #bottombar { position:fixed; bottom:18px; left:24px; display:flex; flex-direction:column;
               gap:6px; z-index:10; }
  .lk { background:none; border:none; padding:0; font:inherit; color:var(--text);
        cursor:pointer; text-align:left; }
  .lk::before { content:"> "; color:var(--dim); }
  .lk:hover { color:var(--bright); }

  #rankOverlay { position:fixed; inset:0; background:rgba(13,17,23,.85); display:none;
                 align-items:center; justify-content:center; z-index:20; }
  #rankOverlay.show { display:flex; }
  #rankCard { width:420px; max-height:76vh; overflow:auto; background:var(--bg);
              border:1px solid var(--line); border-radius:6px; padding:20px 24px; }
  #rankCard h2 { margin:0 0 16px; font-size:13px; font-weight:400; color:var(--dim); }
  #rankCard h2::before { content:"$ "; }
  #rankCard h2 span { color:var(--bright); }
  .row { display:flex; gap:0; padding:5px 0; white-space:pre; }
  .rk { width:4ch; color:var(--dim); }
  .uname { flex:1; overflow:hidden; text-overflow:ellipsis; }
  .row:nth-child(-n+3) .uname { color:var(--bright); }
  .score { color:var(--amber); }
  .row.me { border-top:1px solid var(--line); margin-top:10px; padding-top:12px; }
  .row.me .uname { color:var(--green); }
  .close { margin-top:16px; background:none; border:none; padding:0; font:inherit;
           color:var(--text); cursor:pointer; }
  .close::before { content:"> "; color:var(--dim); }
  .close:hover { color:var(--bright); }
</style>
</head>
<body>
<div id="topbar">
  <span id="status"><span class="p">claude:</span> <span class="v">idle</span><span class="cur"></span></span>
  <span id="hud">coins = <b>0</b></span>
</div>
<div id="bottombar">
  <button class="lk" id="rankBtn">leaderboard</button>
  <button class="lk" id="testBtn">test --start</button>
</div>

<div id="rankOverlay">
  <div id="rankCard">
    <h2><span>coincode leaderboard --top 10</span></h2>
    <div id="rankList"></div>
    <button class="close" id="rankClose">exit</button>
  </div>
</div>

<script>
const FALL_SECONDS = 4, SPAWN_MS = 2000, BIG_CHANCE = 0.05;
let coins = parseInt(localStorage.getItem('coins') || '0');
let working = false, testMode = false, spawnTimer = null;
const hudVal = document.querySelector('#hud b'), statusEl = document.getElementById('status');
const statusVal = document.querySelector('#status .v'), btn = document.getElementById('testBtn');
hudVal.textContent = coins;

let actx = null;
function tickSound() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.03, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + 0.1);
  } catch (e) {}
}

function spawn() {
  const big = Math.random() < BIG_CHANCE;
  const value = big ? 10 : 1;
  const el = document.createElement('div');
  el.className = 'coin' + (big ? ' big' : '');
  el.textContent = '$' + (big ? value : '');
  const size = big ? 60 : 44;
  el.style.width = el.style.height = size + 'px';
  el.style.fontSize = (big ? 22 : 20) + 'px';
  el.style.left = Math.random() * (innerWidth - size) + 'px';
  el.style.top = '-64px';
  document.body.appendChild(el);
  const start = performance.now();
  function fall(now) {
    const t = (now - start) / (FALL_SECONDS * 1000);
    if (t >= 1) { el.remove(); return; }
    el.style.top = (-50 + t * (innerHeight + 100)) + 'px';
    if (el.isConnected) requestAnimationFrame(fall);
  }
  requestAnimationFrame(fall);
  el.onmousedown = e => {
    coins += value;
    localStorage.setItem('coins', coins);
    hudVal.textContent = coins;
    tickSound();
    const pop = document.createElement('div');
    pop.className = 'pop'; pop.textContent = '// +' + value;
    pop.style.left = e.clientX + 8 + 'px'; pop.style.top = (e.clientY - 22) + 'px';
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 600);
    el.remove();
  };
}

function setWorking(on, label, cls) {
  statusVal.textContent = label; statusEl.className = cls || '';
  if (on === working) return;
  working = on;
  if (on) { spawn(); spawnTimer = setInterval(spawn, SPAWN_MS); }
  else { clearInterval(spawnTimer); }
}

btn.onclick = () => {
  testMode = !testMode;
  btn.textContent = testMode ? 'test --stop' : 'test --start';
  if (testMode) setWorking(true, 'test', 'working');
  else setWorking(false, 'idle');
};

async function poll() {
  if (testMode) return;
  try {
    const r = await fetch('/state.txt?' + Date.now());
    const s = (await r.text()).trim();
    if (s === 'working') setWorking(true, 'working', 'working');
    else if (s === 'paused') setWorking(false, 'awaiting approval', 'paused');
    else setWorking(false, 'idle');
  } catch (e) {}
}
setInterval(poll, 500);

const mock = [
  ['torvalds-fan', 284350], ['vibe_coder_42', 261200], ['shipfast-dev', 248900],
  ['0xKaiju', 197540], ['rustacean_m', 165320], ['asyncawaiter', 142800],
  ['gpu_poor', 118650], ['midnight-merge', 97420], ['ship-it-sam', 76310], ['hookmaster', 58200],
];
const overlay = document.getElementById('rankOverlay');
const list = document.getElementById('rankList');

function renderRank() {
  let html = '';
  mock.forEach(([name, score], i) => {
    html += `<div class="row">
      <span class="rk">${String(i + 1).padStart(2, ' ')}</span>
      <span class="uname">${name}</span>
      <span class="score">${score.toLocaleString()}</span>
    </div>`;
  });
  html += `<div class="row me">
    <span class="rk"> →</span>
    <span class="uname">you</span>
    <span class="score">${coins.toLocaleString()}</span>
  </div>`;
  list.innerHTML = html;
}

document.getElementById('rankBtn').onclick = () => { renderRank(); overlay.classList.add('show'); };
document.getElementById('rankClose').onclick = () => overlay.classList.remove('show');
overlay.onclick = e => { if (e.target === overlay) overlay.classList.remove('show'); };
</script>
</body>
</html>
